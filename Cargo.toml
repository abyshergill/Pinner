[package]
name = "pinner"
version = "3.0.0"
edition = "2021"
description = "Organise the folders, files, apps and web links you open every day"
license = "MIT"

[lib]
name = "pinner"
path = "src/lib.rs"

[[bin]]
name = "pinner"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
